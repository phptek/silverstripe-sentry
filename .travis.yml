# See https://github.com/silverstripe-labs/silverstripe-travis-support for setup details

sudo: false

language: php

env:
  global:
    - COMPOSER_ROOT_VERSION=6.0.x-dev
    - SS_ENVIRONMENT_TYPE="dev"

matrix:
  fast_finish: true
  include:
    - php: 8.2
      env:
        - DB=MYSQL
  include:
    - php: 8.3
      env:
        - DB=MYSQL
  include:
    - php: 8.4
      env:
        - DB=MYSQL
  include:
    - php: 8.5
      env:
        - DB=MYSQL

services:
  - mysql

before_script:
  - composer self-update || true
  - composer require --no-update silverstripe/recipe-cms:^6
  - composer install --prefer-dist --no-interaction --no-progress --no-suggest --optimize-autoloader --verbose --profile

script:
  - vendor/bin/phpunit --testsuite sentry

branches:
  only:
    - master
    - 6.0.0
